name: Tự động cập nhật khi Push

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Di chuyển và lấy code mới nhất
        run: |
          cd /home/aurora/exam-management-system
          git pull origin dev

      - name: Cài đặt PHP dependencies
        working-directory: /home/aurora/exam-management-system/src
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Cài đặt JS và Build giao diện
        working-directory: /home/aurora/exam-management-system/src
        run: |
          npm install
          npm run build

      - name: Cập nhật Database
        working-directory: /home/aurora/exam-management-system/src
        run: php artisan migrate --force

      - name: Dọn dẹp cache
        working-directory: /home/aurora/exam-management-system/src
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

