name: Tự động cập nhật khi Push

on:
  push:
    branches:
      - dev  # Khi bạn push code vào nhánh dev thì nó mới chạy

jobs:
  deploy:
    runs-on: self-hosted  # Chạy ngay trên cái Runner dưới máy bạn

    steps:
      - name: Lấy code mới nhất
        uses: actions/checkout@v4

      - name: Cài đặt PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Cài đặt JS và Build giao diện
        run: |
          npm install
          npm run build

      - name: Cập nhật Database
        run: php artisan migrate --force

      - name: Dọn dẹp cache
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
