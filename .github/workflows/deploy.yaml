name: Deploy main branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    env:
      APP_ENV: production
      COMPOSER_FLAGS: --no-interaction --prefer-dist --optimize-autoloader --no-dev

    steps:
      - name: Lấy code mới nhất
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Kiểm tra môi trường runtime
        run: |
          set -euxo pipefail
          php -v
          composer --version
          node -v
          npm -v

      - name: Kiểm tra lock files
        working-directory: ./src
        run: |
          set -euxo pipefail
          test -f composer.lock
          test -f package-lock.json

      - name: Xác thực composer.json
        working-directory: ./src
        run: composer validate --no-check-publish --strict

      - name: Cài đặt PHP dependencies
        working-directory: ./src
        run: composer install $COMPOSER_FLAGS

      - name: Kiểm tra platform requirements (PHP extensions)
        working-directory: ./src
        run: composer check-platform-reqs

      - name: Cài đặt JS và Build giao diện
        working-directory: ./src
        run: |
          set -euxo pipefail
          npm ci
          npm run check:alpine-state
          npm run build

      - name: Chạy lệnh mở rộng cho teammate (nếu có)
        working-directory: ./src
        run: |
          set -euxo pipefail
          if [ -f .github/scripts/deploy-extra.sh ]; then
            chmod +x .github/scripts/deploy-extra.sh
            ./.github/scripts/deploy-extra.sh
          else
            echo "Khong co .github/scripts/deploy-extra.sh, bo qua"
          fi

      - name: Cập nhật Database (Xóa trắng và Seed lại)
        working-directory: ./src
        if: ${{ contains(github.event.head_commit.message, '[fresh-seed]') }}
        run: php artisan migrate:fresh --seed --force --no-interaction

      - name: Cập nhật Database (Bình thường)
        working-directory: ./src
        if: ${{ !contains(github.event.head_commit.message, '[fresh-seed]') }}
        run: php artisan migrate --force --no-interaction

      - name: Tối ưu cache Laravel
        working-directory: ./src
        run: |
          set -euxo pipefail
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Kiểm tra nhanh sau deploy
        working-directory: ./src
        run: php artisan about --only=environment
